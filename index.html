<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계산기</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">계산기</h1>
      <p class="hint">키보드로도 입력할 수 있어요</p>
    </header>

    <main class="calculator" role="application" aria-label="계산기">
      <div class="display-wrap">
        <div class="expression" id="expression" aria-live="polite"></div>
        <div class="result" id="display" aria-live="polite">0</div>
      </div>

      <div class="keys" id="keys">
        <button type="button" class="key key-fn" data-action="clear">AC</button>
        <button type="button" class="key key-fn" data-action="sign">±</button>
        <button type="button" class="key key-fn" data-action="percent">%</button>
        <button type="button" class="key key-op" data-action="operator" data-value="/">÷</button>

        <button type="button" class="key key-num" data-action="digit" data-value="7">7</button>
        <button type="button" class="key key-num" data-action="digit" data-value="8">8</button>
        <button type="button" class="key key-num" data-action="digit" data-value="9">9</button>
        <button type="button" class="key key-op" data-action="operator" data-value="*">×</button>

        <button type="button" class="key key-num" data-action="digit" data-value="4">4</button>
        <button type="button" class="key key-num" data-action="digit" data-value="5">5</button>
        <button type="button" class="key key-num" data-action="digit" data-value="6">6</button>
        <button type="button" class="key key-op" data-action="operator" data-value="-">−</button>

        <button type="button" class="key key-num" data-action="digit" data-value="1">1</button>
        <button type="button" class="key key-num" data-action="digit" data-value="2">2</button>
        <button type="button" class="key key-num" data-action="digit" data-value="3">3</button>
        <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>

        <button type="button" class="key key-num key-zero" data-action="digit" data-value="0">0</button>
        <button type="button" class="key key-num" data-action="decimal">.</button>
        <button type="button" class="key key-op key-equals" data-action="equals">=</button>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
